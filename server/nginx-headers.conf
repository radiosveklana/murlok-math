# Предложение: заголовки безопасности для murlok.tech-wave.ru (nginx). На сервере НЕ применено — ставит владелец.
# Как применить: вставить внутрь server { ... } для murlok.tech-wave.ru (listen 443), затем `nginx -t && systemctl reload nginx`.
# Внимание: в nginx add_header из server{} НЕ наследуется в location{}, где есть свой add_header —
# в таких location эти строки нужно повторить (или вынести в файл и подключать через include в каждом location).

# HTTPS навсегда (год). includeSubDomains не ставим: у tech-wave.ru есть другие поддомены, их проверить отдельно.
add_header Strict-Transport-Security "max-age=31536000" always;

# браузер не «угадывает» тип файла
add_header X-Content-Type-Options "nosniff" always;

# страницу можно встроить только в саму себя (окно отчёта ребёнка в кабинете — iframe с того же сайта)
add_header X-Frame-Options "SAMEORIGIN" always;

# адрес страницы уходит на другие сайты только как домен
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# лишние возможности браузера выключены; микрофон — только для своего сайта (голосовой разговор с котиком)
add_header Permissions-Policy "camera=(), geolocation=(), payment=(), usb=(), microphone=(self)" always;

# CSP пока в режиме «только отчёт»: ничего не блокирует, лишь пишет нарушения в консоль браузера.
# Источники: свой сайт, шрифты Google, API на этом же домене (/api) и старый адрес API (level.tech-wave.ru),
# Яндекс.Метрика (если подключена). 'unsafe-inline': на лендинге (index.html) есть встроенные скрипты, а приложение вставляет <style> из JS;
# позже встроенные скрипты лендинга можно вынести в файлы и убрать 'unsafe-inline' из script-src.
# Когда неделю не будет нарушений — заменить заголовок на Content-Security-Policy (без -Report-Only).
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' 'unsafe-inline' https://mc.yandex.ru; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://mc.yandex.ru; media-src 'self' blob: data:; connect-src 'self' https://level.tech-wave.ru https://mc.yandex.ru; frame-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

# служебные файлы — настоящий 404 вместо index.html
location ~ /\.(git|env|ht) { deny all; return 404; }
