<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Админка «Мурлок и Ко»</title>
<style>
:root{--bg:#F6F3FB;--card:#fff;--ink:#2D2340;--muted:#7A6E8F;--pink:#E0447A;--mint:#1E9E62;--line:#E8E1F2;--red:#D9534F;--gold:#E8A21B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;flex-wrap:wrap}
header b{font-size:17px}nav{display:flex;gap:4px;flex-wrap:wrap}nav button{border:0;background:none;padding:8px 12px;border-radius:10px;font:inherit;color:var(--muted);cursor:pointer}nav button.on{background:#F1E9FF;color:var(--ink);font-weight:700}
main{max-width:1100px;margin:0 auto;padding:16px}.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:0 2px 10px rgba(60,30,90,.06);margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}.kpi{background:#FAF7FF;border-radius:12px;padding:12px}.kpi b{display:block;font-size:26px}.kpi small{color:var(--muted)}
table{width:100%;border-collapse:collapse}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600;font-size:13px}tr.click{cursor:pointer}tr.click:hover{background:#FAF7FF}
input,textarea,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}textarea{min-height:140px}
.btn{border:0;border-radius:10px;padding:9px 14px;font:inherit;font-weight:700;cursor:pointer;background:#EDE6F7;color:var(--ink)}.btn.p{background:var(--pink);color:#fff}.btn.d{background:#FDE3E3;color:var(--red)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--mint)}.small{font-size:13px;color:var(--muted)}.tag{display:inline-block;padding:2px 8px;border-radius:8px;background:#F1E9FF;font-size:12px;margin:2px}
.flag{border-left:4px solid var(--gold);padding:8px 10px;margin:6px 0;background:#FFFBEF;border-radius:8px}.flag.distress{border-color:var(--red);background:#FFF3F3}
#login{max-width:340px;margin:12vh auto}.hidden{display:none}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px}
@media(max-width:600px){td,th{font-size:13px;padding:6px 4px}.kpi b{font-size:22px}}
</style></head><body>
<div id="login" class="card"><h2>🐾 Админка «Мурлок и Ко»</h2><p class="small">Вход для владельца сервиса.</p><div style="display:grid;gap:8px"><input id="u" placeholder="Логин" autocomplete="username"><input id="p" type="password" placeholder="Пароль" autocomplete="current-password"><button class="btn p" id="lgo">Войти</button><div id="lerr" class="small" style="color:var(--red)"></div></div></div>
<div id="app" class="hidden"><header><b>🐾 Мурлок и Ко</b><nav id="nav"><button data-t="home" class="on">Главная</button><button data-t="fams">Семьи</button><button data-t="flags">Тревоги <span id="fn"></span></button><button data-t="mail">Рассылка</button><button data-t="cons">Согласия</button><button data-t="set">Настройки</button></nav><span style="flex:1"></span><button class="btn" id="out">Выйти</button></header><main id="m"></main></div>
<script>
const $ = s => document.querySelector(s), esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const api = async (p, o = {}) => { const r = await fetch('/admin/api/' + p, { method: o.body ? 'POST' : 'GET', headers: o.body ? { 'content-type': 'application/json' } : {}, body: o.body ? JSON.stringify(o.body) : undefined, credentials: 'same-origin' }); if (r.status === 401 && p !== 'login') { show(false); throw new Error('auth'); } return r.json(); };
const toast = t => { const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 2500); };
const dt = t => t ? new Date(t).toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
function show(on) { $('#login').classList.toggle('hidden', on); $('#app').classList.toggle('hidden', !on); if (on) tab('home'); }
$('#lgo').onclick = async () => { const r = await fetch('/admin/api/login', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ user: $('#u').value, pass: $('#p').value }) }); if (r.ok) show(true); else $('#lerr').textContent = 'Неверный логин или пароль'; };
$('#p').onkeydown = e => { if (e.key === 'Enter') $('#lgo').click(); };
$('#out').onclick = async () => { await api('logout', { body: {} }).catch(() => { }); show(false); };
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) tab(b.dataset.t); };
const T = {
  async home() { const s = await api('stats'); $('#fn').textContent = s.flagsNew ? '(' + s.flagsNew + ')' : ''; const mx = Math.max(1, ...s.areas.map(a => a.minutes));
    return `<div class="card"><h3>Коротко</h3><div class="kpis"><div class="kpi"><b>${s.families}</b><small>семей</small></div><div class="kpi"><b>${s.children}</b><small>детей</small></div><div class="kpi"><b>${s.active.day}</b><small>активны сегодня</small></div><div class="kpi"><b>${s.active.week}</b><small>за неделю</small></div><div class="kpi"><b>${s.active.month}</b><small>за месяц</small></div><div class="kpi"><b>${s.minutesPerKidDay}</b><small>минут в день на ребёнка</small></div><div class="kpi"><b>${s.unlinkedSaves}</b><small>играют без кабинета</small></div></div></div>
      <div class="card"><h3>Разделы (минуты за неделю)</h3>${s.areas.length ? s.areas.map(a => `<div class="row" style="margin:6px 0"><span style="width:190px">${esc(a.name)}</span><div class="bar" style="flex:1"><i style="width:${a.minutes / mx * 100}%"></i></div><span class="small" style="width:70px;text-align:right">${a.minutes} мин</span></div>`).join('') : '<p class="small">Пока нет данных.</p>'}
      <h4>Предметы Академии (сколько тренировок)</h4>${s.subjects.map(x => `<span class="tag">${esc(x.id)}: ${x.n}</span>`).join('') || '<p class="small">—</p>'}</div>
      <div class="card"><h3>Откуда приходят</h3><p>По реферальным ссылкам: <b>${s.sources.viaRef}</b> · напрямую: <b>${s.sources.direct}</b></p>${s.sources.top.length ? `<table><tr><th>Код</th><th>Чей</th><th>Переходы</th><th>Регистрации</th></tr>${s.sources.top.map(r => `<tr><td>${r.code}</td><td>${esc(r.owner)}</td><td>${r.visits}</td><td>${r.regs}</td></tr>`).join('')}</table>` : ''}</div>`; },
  async fams() { return `<div class="card"><div class="row"><input id="q" placeholder="Поиск по почте или имени ребёнка" style="flex:1"><button class="btn p" id="qs">Найти</button></div><div id="fl" style="margin-top:10px"></div></div><div id="fd"></div>`; },
  async flags() { const d = await api('flags'); return `<div class="card"><div class="row"><h3 style="flex:1">Тревожные отметки из разговоров с котиком</h3><button class="btn" id="fseen">Отметить всё прочитанным</button></div>${d.flags.length ? d.flags.map(f => `<div class="flag ${f.flag}"><b>${f.flag === 'distress' ? '⚠️ ребёнку плохо или страшно' : f.flag === 'pii' ? '🔒 личные данные' : '🚫 неподходящая тема'}</b> · ${dt(f.ts)} ${f.seen ? '' : '<span class="tag">новое</span>'}<br>Ребёнок: ${esc(f.kid || '—')} · котик ${esc(f.cat || '—')}<br>«${esc(f.text)}»</div>`).join('') : '<p class="small">Отметок нет 👍</p>'}</div>`; },
  async mail() { return `<div class="card"><h3>Рассылка родителям</h3><div style="display:grid;gap:8px"><input id="ms" placeholder="Тема письма" value="Новости «Мурлок и Ко»"><textarea id="mt" placeholder="Текст сообщения"></textarea><div class="row"><select id="mc" style="width:auto"><option value="both">Почта + Telegram</option><option value="email">Только почта</option><option value="tg">Только Telegram</option></select><select id="mg" style="width:auto"><option value="all">Все семьи</option><option value="active7">Активные за неделю</option></select><button class="btn p" id="msend">Отправить</button></div><p class="small">Telegram получают только родители, подключившие бота. Письма уходят с team@tech-wave.ru, по одному в секунду.</p></div></div>`; },
  async cons() { const d = await api('consents'); return `<div class="card"><h3>Журнал согласий (152-ФЗ)</h3><table><tr><th>Когда</th><th>Событие</th><th>Семья</th><th>Версия</th><th>IP</th></tr>${d.consents.map(c => `<tr><td>${dt(c.at)}</td><td>${{ consent: '✅ согласие', revoke: '↩️ отзыв', delete: '🗑 удаление', 'admin-delete': '🗑 удаление (админ)' }[c.type] || esc(c.type)}</td><td>${esc(c.family)}</td><td>${esc(c.ver || '')}</td><td>${esc(c.ip || '')}</td></tr>`).join('')}</table></div>`; },
  async set() { const d = await api('tglink'); return `<div class="card"><h3>Уведомления в Telegram</h3><p>${d.linked ? '✅ Подключено: тревожные отметки приходят вам в Telegram.' : 'Не подключено.'}</p>${d.url ? `<p><a class="btn p" href="${d.url}" target="_blank" rel="noopener">${d.linked ? 'Переподключить' : 'Подключить'} Telegram</a></p><p class="small">Откройте ссылку и нажмите «Старт» в боте. Ссылка одноразовая.</p>` : '<p class="small">Бот не настроен.</p>'}</div>`; },
};
async function tab(t) { document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t)); $('#m').innerHTML = '<p class="small">Загрузка…</p>'; try { $('#m').innerHTML = await T[t](); bind(t); } catch (e) { if (e.message !== 'auth') $('#m').innerHTML = '<p>Ошибка загрузки</p>'; } }
function bind(t) {
  if (t === 'fams') { const load = async () => { const d = await api('families?q=' + encodeURIComponent($('#q').value)); $('#fl').innerHTML = `<table><tr><th>Почта</th><th>Дети</th><th>Последняя активность</th><th>Регистрация</th></tr>${d.families.map(f => `<tr class="click" data-f="${f.id}"><td>${esc(f.email)}</td><td>${f.kids.map(k => `${esc(k.name)} <span class="small">⭐${k.xp} · ${k.minutesWeek} мин/нед</span>`).join('<br>') || '—'}</td><td>${dt(Math.max(0, ...f.kids.map(k => k.lastSeen || 0)))}</td><td>${dt(f.created)}</td></tr>`).join('')}</table>`; document.querySelectorAll('[data-f]').forEach(r => r.onclick = () => fam(r.dataset.f)); }; $('#qs').onclick = load; $('#q').onkeydown = e => { if (e.key === 'Enter') load(); }; load(); }
  if (t === 'flags') $('#fseen').onclick = async () => { await api('flags', { body: {} }); tab('flags'); };
  if (t === 'mail') $('#msend').onclick = async () => { if (!confirm('Отправить рассылку?')) return; const r = await api('broadcast', { body: { subject: $('#ms').value, text: $('#mt').value, channel: $('#mc').value, target: $('#mg').value } }); toast(r.ok ? `Отправлено: почта ${r.email}, Telegram ${r.tg}` : 'Ошибка'); };
}
async function fam(id) {
  const f = await api('family/' + id);
  $('#fd').innerHTML = `<div class="card"><h3>${esc(f.email)} <span class="tag">${esc(f.plan)}</span></h3><p class="small">Семья ${f.id} · код семьи ${f.code} · с ${dt(f.created)} · согласие ${esc(f.consent && f.consent.ver)} от ${dt(f.consent && f.consent.at)}${f.refBy ? ' · пришли по ссылке ' + f.refBy : ''}</p><p>Приоритеты: ${(f.priorities || []).map(p => `<span class="tag">${esc(p)}</span>`).join('') || '—'}</p>
    ${f.children.map(k => `<div class="card" style="background:#FCFAFF"><h4>${esc(k.name)} · котик ${esc(k.cat)}</h4><p>⭐ ${k.xp} · 🍬 ${k.candies} · 💎 ${k.gems} · дел ${k.cases} · дипломов ${k.diplomas} · ${k.minutesWeek} мин за неделю · был(а) ${dt(k.lastSeen)}</p>
      <p class="small">Навыки: ${k.skills.map(s => `<span class="tag">${esc(s.id)} ${s.a}% (${s.n})</span>`).join('')}</p>${k.survey ? `<p class="small">Опрос: ${esc(JSON.stringify(k.survey))}</p>` : ''}${k.ref ? `<p class="small">Реферальная ссылка ребёнка: переходы ${k.ref.visits}, регистрации ${k.ref.regs}</p>` : ''}
      ${k.flags.length ? `<p>⚠️ Отметок: ${k.flags.length}</p>` : ''}
      <div class="row"><input id="gc-${k.id}" type="number" placeholder="🍬" style="width:90px"><input id="gg-${k.id}" type="number" placeholder="💎" style="width:90px"><input id="gn-${k.id}" placeholder="За что (увидит ребёнок)" style="flex:1;min-width:160px"><button class="btn p" data-grant="${k.id}">Начислить</button></div>
      <div class="row" style="margin-top:8px"><button class="btn" data-rpin="${k.id}">Сбросить ПИН</button><select id="sd-${k.id}" style="width:auto">${k.snapshots.map(d => `<option>${d}</option>`).join('')}</select><button class="btn" data-rest="${k.id}" ${k.snapshots.length ? '' : 'disabled'}>Восстановить прогресс на дату</button></div></div>`).join('')}
    <div class="row"><a class="btn" href="/admin/api/family/${f.id}/export">Выгрузить данные</a><button class="btn d" id="fdel">Удалить семью и все данные</button></div></div>`;
  document.querySelectorAll('[data-grant]').forEach(b => b.onclick = async () => { const id = b.dataset.grant; await api('child/' + id + '/grant', { body: { candies: $('#gc-' + id).value, gems: $('#gg-' + id).value, note: $('#gn-' + id).value } }); toast('Начислено — ребёнок получит при следующем входе'); });
  document.querySelectorAll('[data-rpin]').forEach(b => b.onclick = async () => { await api('child/' + b.dataset.rpin + '/resetpin', { body: {} }); toast('ПИН сброшен'); });
  document.querySelectorAll('[data-rest]').forEach(b => b.onclick = async () => { const id = b.dataset.rest, d = $('#sd-' + id).value; if (!confirm('Восстановить прогресс на ' + d + '? Текущий сохранится в резервную копию.')) return; const r = await api('child/' + id + '/restore', { body: { day: d } }); toast(r.ok ? 'Восстановлено — применится при следующем входе ребёнка' : 'Ошибка'); });
  $('#fdel').onclick = async () => { const c = prompt('Удалить семью и ВСЕ данные без возможности восстановления? Напишите УДАЛИТЬ'); if (c !== 'УДАЛИТЬ') return; await api('family/' + f.id + '/delete', { body: { confirm: c } }); toast('Удалено'); tab('fams'); };
  $('#fd').scrollIntoView({ behavior: 'smooth' });
}
api('stats').then(() => show(true)).catch(() => show(false));
</script></body></html>
